# /etc/nginx/sites-available/topovik.com
# Alongside vuca on the same host — does NOT touch vucadigital.by default site.
# Host ports: frontend 3010, cms 1340 (vuca keeps 3000/1337).

upstream topovik_frontend {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream topovik_cms {
    server 127.0.0.1:1340;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name topovik.com www.topovik.com;

    charset utf-8;
    client_max_body_size 64m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name topovik.com www.topovik.com;

    charset utf-8;
    client_max_body_size 64m;

    ssl_certificate     /etc/letsencrypt/live/topovik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topovik.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    if ($host = www.topovik.com) {
        return 301 https://topovik.com$request_uri;
    }

    # Cache Next.js image optimizer output (sharp is expensive on first hit).
    location ^~ /_next/image {
        proxy_pass http://topovik_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache topovik_images;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /admin {
        proxy_pass http://topovik_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Next.js app routes (must win over Strapi /api/)
    location ^~ /api/search {
        proxy_pass http://topovik_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /api/subscribe {
        proxy_pass http://topovik_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /api/revalidate {
        proxy_pass http://topovik_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        proxy_pass http://topovik_cms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Serve media from disk (not via Strapi) — much faster.
    location ^~ /uploads/ {
        alias /var/www/topovik/cms/public/uploads/;
        charset utf-8;
        sendfile on;
        tcp_nopush on;
        open_file_cache max=5000 inactive=60s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://topovik_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
